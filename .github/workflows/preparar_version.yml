name: Preparar versión (borrador)

on:
  workflow_dispatch:
    inputs:
      tag:      { description: "Etiqueta de la versión", required: true, default: "beta-adimaker26" }
      titulo:   { description: "Título", required: true, default: "Beta Adimaker26" }
      notas:    { description: "Archivo de notas en .github/notas", required: true, default: "beta-adimaker26.md" }
      artifact: { description: "ID del artifact portable en RPalGar/OrcaSlicer", required: true }
      artifact_mac: { description: "ID del artifact Mac universal en RPalGar/OrcaSlicer (opcional)", required: false, default: "" }
      artifact_linux: { description: "ID del artifact Flatpak x86_64 en RPalGar/OrcaSlicer (opcional)", required: false, default: "" }
      commit:   { description: "Commit de RPalGar/OrcaSlicer con el que se compiló", required: true }

permissions:
  contents: write

jobs:
  borrador:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el portable compilado
        run: |
          gh api "repos/RPalGar/OrcaSlicer/actions/artifacts/${{ inputs.artifact }}/zip" > artifact.zip
          mkdir dist && unzip -q artifact.zip -d art
          ls -la art
          cp art/*.zip dist/ 2>/dev/null || (cd art && zip -qr "../dist/OrcaSlicer_Windows_V2.5.0-dev_x64_portable.zip" .)
      - name: Descargar el Mac universal compilado
        if: inputs.artifact_mac != ''
        run: |
          gh api "repos/RPalGar/OrcaSlicer/actions/artifacts/${{ inputs.artifact_mac }}/zip" > mac.zip
          mkdir mac && unzip -q mac.zip -d mac
          ls -la mac
          dmg=$(find mac -name "*.dmg" | head -1)
          if [ -n "$dmg" ]; then cp "$dmg" "dist/OrcaSlicer_Mac_universal_V2.5.0-dev.dmg"; else (cd mac && zip -qr "../dist/OrcaSlicer_Mac_universal_V2.5.0-dev.zip" .); fi
      - name: Descargar el Flatpak de Linux compilado
        if: inputs.artifact_linux != ''
        run: |
          gh api "repos/RPalGar/OrcaSlicer/actions/artifacts/${{ inputs.artifact_linux }}/zip" > linux.zip
          mkdir linux && unzip -q linux.zip -d linux
          ls -la linux
          cp "$(find linux -name "*.flatpak" | head -1)" "dist/OrcaSlicer_Linux_V2.5.0-dev_x86_64.flatpak"
      - name: Empaquetar el código fuente exacto
        run: |
          git init -q src && cd src
          git remote add origin https://github.com/RPalGar/OrcaSlicer.git
          git fetch -q --depth 1 origin "${{ inputs.commit }}"
          short=$(echo "${{ inputs.commit }}" | cut -c1-8)
          git archive --format=zip --prefix="OrcaSlicer-IMDISIM-PathCut-$short/" -o "../dist/codigo-fuente-$short.zip" FETCH_HEAD
      - name: Crear o actualizar la versión en borrador
        run: |
          ls -la dist
          short=$(echo "${{ inputs.commit }}" | cut -c1-8)
          sed -e "s/{{COMMIT_CORTO}}/$short/g" -e "s/{{COMMIT}}/${{ inputs.commit }}/g" ".github/notas/${{ inputs.notas }}" > notas.md
          # Un borrador anterior con la misma etiqueta se reutiliza: se le quitan sus archivos y se suben los nuevos.
          # Los borradores pueden perder la etiqueta al editarse (aparecen como "untagged-..."): se busca también por título.
          id=$(gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.draft and (.tag_name == "${{ inputs.tag }}" or .name == "${{ inputs.titulo }}")) | .id' | head -1)
          if [ -n "$id" ]; then
            for a in $(gh api "repos/${{ github.repository }}/releases/$id/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$a"
            done
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f tag_name="${{ inputs.tag }}" -f name="${{ inputs.titulo }}" -F body=@notas.md -f target_commitish="${{ github.sha }}" > /dev/null
            for f in dist/*; do
              curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$(basename "$f")" > /dev/null
            done
          else
            gh release create "${{ inputs.tag }}" dist/* --draft --target "${{ github.sha }}" \
              --title "${{ inputs.titulo }}" --notes-file notas.md
          fi
